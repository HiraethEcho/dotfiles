[osd]
monitors = [ "eDP-1" ]

    [osd.kinds]
    keyboard_layout = false
    media = false

[plugins]
auto_update = "none"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    enabled = false
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
font_family = "CodeNewRoman Nerd Font Propo"
niri_overview_type_to_launch_enabled = true
screen_time_enabled = true

    [shell.animation]
    speed = 2.0000000298023224

    [shell.panel]
    clipboard_placement = "attached"
    open_near_click_control_center = true

    [shell.screenshot]
    directory = "/home/hiraeth/Pictures/Screenshots"

[theme]
builtin = "Nord"
community_palette = "One"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "foot", "kitty" ]
    community_ids = [ "opencode", "obsidian", "rofi", "fastfetch", "zathura", "yazi" ]

[wallpaper]
per_monitor_directories = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 600

    [wallpaper.default]
    path = "/home/hiraeth/Pictures/Wallpapers/fuji.png"

    [wallpaper.last]
    path = "/home/hiraeth/Pictures/Wallpapers/fuji.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/hiraeth/Pictures/Wallpapers/abstract.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/hiraeth/Pictures/Wallpapers/fuji.png"

[widget.control-center]
glyph = "navigation-filled"

[widget.date]
format = "{:%a %m %d}"

[widget.taskbar]
group_by_workspace = true
only_active_workspace = true
show_window_title = true
window_title_max_width = 75

[widget.workspaces]
max_label_chars = 4