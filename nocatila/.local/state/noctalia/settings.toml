config_version = 13

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.40000000000000002
    capsule = true
    capsule_opacity = 0.5
    center = [ "group:g1", "group:g4" ]
    end = [ "tray", "group:g6", "group:g2", "group:g3" ]
    font_family = "DaddyTimeMono Nerd Font Mono"
    font_weight = 400
    margin_ends = 0
    radius = 0
    start = [ "group:g7", "group:g5" ]

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g2"
        members = [ "network", "bluetooth", "battery" ]
        opacity = 0.5
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g3"
        members = [ "date", "clock" ]
        opacity = 0.5
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "theme_mode", "clipboard", "screenshot", "caffeine", "wallpaper" ]
        opacity = 0.5
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g4"
        members = [ "cpu", "ram" ]
        opacity = 0.5
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g6"
        members = [ "brightness", "volume", "input_volume" ]
        opacity = 0.5
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g5"
        members = [ "taskbar", "active_window" ]
        opacity = 0.5
        padding = 6.0

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g7"
        members = [ "control-center", "workspaces" ]
        opacity = 0.5
        padding = 6.0

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true

[calendar]
enabled = true

    [calendar.account.home_radicale]
    provider = "custom"
    server_url = "https://radicale.keinmal.top/"
    type = "caldav"
    username = "hiraeth"

[control_center]
hidden_tabs = [ "media" ]
show_session_button = false
show_shortcut_labels = false

    [control_center.calendar]
    show_events_card = false
    show_week_numbers = true

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "wallpaper"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
enabled = false

[location]
auto_locate = true

