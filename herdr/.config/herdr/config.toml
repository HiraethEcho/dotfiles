onboarding = false
[theme]
name = "terminal"
auto_switch = false

[ui]
status_indicators = "symbols"

show_agent_labels_on_pane_borders = false
[ui.sound]
enabled = false

[ui.toast]
delivery = "system"
[worktrees]
directory = "~/WorkSpace/worktrees"
[experimental]
kitty_graphics = true

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "osamahbeig.pane-mover.open"
description = "move this pane"
